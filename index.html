<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Movieban — your personal movie companion. Browse, track releases, and keep a watchlist online." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Movieban" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Movieban</title>
    <script>
      // Apply the persisted (or OS-default) theme before first paint so the
      // page never flashes the wrong theme. Mirrors useTheme resolution.
      try {
        var stored = window.localStorage.getItem('movieban-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = theme
      } catch (e) {
        /* The React hook applies a best-effort theme on mount instead. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // This app ships ES modules with root-absolute asset URLs, so it cannot
      // run from file:// (browsers block module scripts without http/https).
      // Start it with `npm run dev` or serve dist/ with `npm run preview`.
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<main style="max-width:32rem;margin:4rem auto;padding:0 1rem;' +
          'font-family:system-ui,sans-serif;line-height:1.5">' +
          '<h1>Movieban needs a local server</h1>' +
          '<p>Opening index.html directly is not supported. Run one of:</p>' +
          '<ul><li><code>npm run dev</code> (development)</li>' +
          '<li><code>npm run build</code> then <code>npm run preview</code> (production)</li></ul></main>'
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>Movieban needs JavaScript to run.</noscript>
  </body>
</html>
